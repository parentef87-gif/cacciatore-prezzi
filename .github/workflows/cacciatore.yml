name: Cacciatore errori di prezzo

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      simula:
        description: 'Prova: nome di UN negozio su cui fingere un crollo di prezzo (vuoto = giro normale)'
        required: false
        default: ''

concurrency:
  group: cacciatore
  cancel-in-progress: false

jobs:
  caccia:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Recupera archivio prezzi
        uses: actions/cache/restore@v4
        with:
          path: |
            prezzi
            avvisi.log
          key: prezzi-${{ github.run_id }}
          restore-keys: prezzi-

      - name: Prepara codice del bot (dai segreti)
        shell: powershell
        env:
          TG: ${{ secrets.TELEGRAM_CACCIATORE }}
        run: |
          # toglie spazi, a capo e caratteri invisibili (es. BOM) che rendono il codice non valido
          ($env:TG -replace '[^A-Za-z0-9:_|-]', '') | ConvertTo-SecureString -AsPlainText -Force | ConvertFrom-SecureString | Out-File telegram.dat -Encoding ascii

      - name: Caccia agli errori di prezzo
        shell: powershell
        env:
          SIMULA: ${{ github.event.inputs.simula }}
        run: |
          if ($env:SIMULA) { powershell -NoProfile -ExecutionPolicy Bypass -File .\cacciatore.ps1 -Simula -Negozio ($env:SIMULA -replace '[^a-z0-9.\-]', '') }
          else { powershell -NoProfile -ExecutionPolicy Bypass -File .\cacciatore.ps1 }

      - name: Riassunto (sul bot Report UNA volta al giorno, la sera dalle 21)
        if: always()
        shell: powershell
        env:
          TGR: ${{ secrets.TELEGRAM_REPORT }}
        run: |
          # 20/11/2026 utente: "togli le notifiche report cacciatore, falle arrivare solo la sera"
          # -> niente piu' messaggio ogni 15 minuti: un solo riassunto delle ultime 24 ore, primo giro dalle 21 ora italiana
          $letti = 0; $errori = 0; $avvisi = 0; $tgKo = 0
          if (Test-Path avvisi.log) {
            $righe  = @(Get-Content avvisi.log | Where-Object { $_ -match '^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d' })
            $giro   = @($righe | Where-Object { [datetime]$_.Substring(0,19) -gt (Get-Date).AddMinutes(-20) })
            $giorno = @($righe | Where-Object { [datetime]$_.Substring(0,19) -gt (Get-Date).AddHours(-24) })
            $letti  = @($giro   | Where-Object { $_ -match 'controllati|prima lettura' }).Count
            $errori = @($giorno | Where-Object { $_ -match 'non riuscita|pausa' }).Count
            $avvisi = @($giorno | Where-Object { $_ -match 'AVVISO' }).Count
            $tgKo   = @($giorno | Where-Object { $_ -match 'Telegram non riuscito' }).Count
            "LETTI BENE (questo giro): $letti"; "ERRORI O PAUSA (24h): $errori"; "AVVISI (24h): $avvisi"; "TELEGRAM NON RIUSCITO (24h): $tgKo"
            $giro | Where-Object { $_ -match 'AVVISO|non riuscita|pausa|Telegram non' } | Select-Object -Last 20
          }
          $ora = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date).ToUniversalTime(), 'W. Europe Standard Time')
          $oggiIt = $ora.ToString('yyyy-MM-dd')
          $segno = 'prezzi\_report_serale.txt'
          if ($ora.Hour -lt 21) { "Prima delle 21: niente messaggio sul bot Report"; exit 0 }
          if ((Test-Path $segno) -and ((Get-Content $segno -Raw).Trim() -eq $oggiIt)) { "Report serale gia' mandato oggi"; exit 0 }
          $tot = @(Get-Content negozi.txt | Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') }).Count
          $esito = if ('${{ job.status }}' -eq 'success' -and $letti -gt 0) { [char]0x2705 + ' Cacciatore: tutto ok' } else { [char]0x26A0 + ' Cacciatore: ultimo giro con problemi' }
          $testo = "REPORT SERALE CACCIATORE ($($ora.ToString('dd/MM HH:mm')))`n$esito`nNegozi letti nell'ultimo giro: $letti su $tot`nNon riusciti / in pausa (24 ore): $errori`nCrolli di prezzo trovati (24 ore): $avvisi" + $(if ($tgKo) { "`nATTENZIONE: $tgKo avvisi NON consegnati su Telegram" } else { '' })
          $t = $env:TGR -replace '[^A-Za-z0-9:_|-]', ''
          if ($t) {
            $tok, $chat = $t -split '\|', 2
            try {
              Invoke-RestMethod "https://api.telegram.org/bot$tok/sendMessage" -Method Post -Body @{ chat_id = $chat; text = $testo } -TimeoutSec 20 | Out-Null
              New-Item -ItemType Directory -Force prezzi | Out-Null; Set-Content $segno $oggiIt -Encoding ascii
              "Messaggio Report serale inviato"
            }
            catch { "Messaggio Report NON inviato: $($_.Exception.Message)" }
          }

      - name: Salva archivio prezzi
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            prezzi
            avvisi.log
          key: prezzi-${{ github.run_id }}
